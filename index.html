<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>diig official site</title>
<style>
  * {
    box-sizing: border-box;
    user-select: none;
  }
  body {
    margin: 0;
    padding: 0;
    height: 100vh;
    background: linear-gradient(135deg, #a8c0ff, #3f2b96);
    font-family: 'Courier New', Courier, monospace;
    overflow: hidden;
    position: relative;
  }
  
  /* レトロ背景模様 */
  .bg-pattern {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image: radial-gradient(rgba(255, 255, 255, 0.2) 1px, transparent 0);
    background-size: 16px 16px;
    pointer-events: none;
  }

  /* ヘッダーSNSリンク */
  .header-sns {
    position: absolute;
    top: 10px;
    right: 15px;
    display: flex;
    gap: 8px;
    z-index: 10;
  }
  .sns-btn {
    background: #c0c0c0;
    border: 2px solid;
    border-color: #ffffff #808080 #808080 #ffffff;
    padding: 4px 10px;
    font-size: 12px;
    color: #000;
    text-decoration: none;
    font-weight: bold;
    box-shadow: 1px 1px 0px #000;
  }
  .sns-btn:active {
    border-color: #808080 #ffffff #ffffff #808080;
  }

  /* ロゴ */
  .site-logo {
    position: absolute;
    top: 10px;
    left: 15px;
    font-size: 36px;
    font-weight: bold;
    font-style: italic;
    color: #fff;
    text-shadow: 2px 2px #ff007f, -2px -2px #00ffff;
    z-index: 10;
  }

  /* ウィンドウ共通スタイル */
  .window {
    position: absolute;
    background: #c0c0c0;
    border: 2px solid;
    border-color: #ffffff #000000 #000000 #ffffff;
    box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.3);
    width: 320px;
    z-index: 20;
  }

  .window-header {
    background: linear-gradient(90deg, #ffb6c1, #ff69b4);
    padding: 3px 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: move;
    font-size: 13px;
    font-weight: bold;
    color: #000;
  }

  .window-header.blue {
    background: linear-gradient(90deg, #7b68ee, #6a5acd);
    color: #fff;
  }

  .close-btn {
    background: #c0c0c0;
    border: 1px solid;
    border-color: #ffffff #808080 #808080 #ffffff;
    width: 18px;
    height: 18px;
    font-size: 11px;
    line-height: 14px;
    text-align: center;
    cursor: pointer;
    font-weight: bold;
    color: #000;
  }
  .close-btn:active {
    border-color: #808080 #ffffff #ffffff #808080;
  }

  .window-body {
    padding: 8px;
    background: #fff;
    margin: 4px;
    border: 2px solid;
    border-color: #808080 #ffffff #ffffff #808080;
    max-height: 350px;
    overflow-y: auto;
  }

  /* メイン画像＆マーキー */
  .main-img {
    width: 100%;
    height: auto;
    display: block;
    border: 1px solid #808080;
  }
  marquee {
    margin-top: 5px;
    font-size: 12px;
    color: #d10068;
    background: #ffe4e1;
    padding: 2px;
  }

  /* ニュースリスト */
  .news-list {
    list-style: none;
    padding: 0;
    margin: 0;
    font-size: 12px;
  }
  .news-item {
    margin-bottom: 10px;
    border-bottom: 1px dashed #ccc;
    padding-bottom: 5px;
  }
  .news-date {
    color: #888;
    font-size: 11px;
  }
  .news-title {
    font-weight: bold;
    color: #000;
    margin-top: 2px;
  }

  /* タスクバー */
  .taskbar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 36px;
    background: #c0c0c0;
    border-top: 2px solid #ffffff;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 2px 4px;
    z-index: 100;
  }

  .taskbar-left {
    display: flex;
    gap: 4px;
  }

  .task-btn {
    background: #c0c0c0;
    border: 2px solid;
    border-color: #ffffff #808080 #808080 #ffffff;
    padding: 3px 8px;
    font-size: 12px;
    font-weight: bold;
    display: flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
  }
  .task-btn:active {
    border-color: #808080 #ffffff #ffffff #808080;
  }

  .clock-box {
    background: #c0c0c0;
    border: 2px solid;
    border-color: #808080 #ffffff #ffffff #808080;
    padding: 3px 8px;
    font-size: 12px;
    font-weight: bold;
  }

  /* 初期位置 */
  #win1 { top: 70px; left: 20px; }
  #win2 { top: 220px; left: 50px; }

  @media (max-width: 480px) {
    .window { width: 280px; }
    #win1 { top: 60px; left: 10px; }
    #win2 { top: 240px; left: 30px; }
  }
</style>
</head>
